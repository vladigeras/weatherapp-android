name: build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
jobs:
  build:
    permissions:
      checks: write
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        timeout-minutes: 10
        run: |
          cat > "$RUNNER_TEMP/test-diagnostics.gradle" <<'EOF'
          allprojects {
              tasks.withType(Test).configureEach {
                  testLogging {
                      events 'started', 'passed', 'failed'
                      exceptionFormat 'full'
                      showStandardStreams = true
                  }
              }
          }
          EOF
          ./gradlew test --init-script "$RUNNER_TEMP/test-diagnostics.gradle" &
          test_pid=$!
          (
            for snapshot in $(seq 1 18); do
              sleep 30
              kill -0 "$test_pid" 2>/dev/null || break
              for worker_pid in $(jcmd -l | awk '/org.gradle.process.internal.worker.GradleWorkerMain/ { print $1 }'); do
                jcmd "$worker_pid" Thread.print -l > "$RUNNER_TEMP/test-threads-$snapshot-$worker_pid.txt" 2>&1 || true
              done
            done
          ) &
          diagnostics_pid=$!
          trap 'kill "$diagnostics_pid" 2>/dev/null || true' EXIT
          wait "$test_pid"

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-thread-diagnostics
          path: ${{ runner.temp }}/test-threads-*.txt
          if-no-files-found: ignore
        
      - name: Publish Test Report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: JUnit Tests
          path: "app/build/test-results/**/TEST-*.xml"
          reporter: java-junit
